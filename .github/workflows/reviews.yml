name: Refresh Google reviews

on:
  schedule:
    - cron: "17 11 * * 1" # Mondays, early morning Central
  workflow_dispatch:

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node scripts/fetch-reviews.mjs
        env:
          OUTSCRAPER_API_KEY: ${{ secrets.OUTSCRAPER_API_KEY }}
      - name: Commit if reviews changed
        run: |
          if git diff --quiet src/content/reviews.json; then exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898+github-actions[bot]@users.noreply.github.com"
          git add src/content/reviews.json
          git commit -m "Refresh Google reviews"
          git push
